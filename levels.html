<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your level</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="level-container">
        <h1>Choose Your level</h1>
        <p>How difficult would you like the challenge to be?</p>
        <div class="level-cards">
                <div class="level-card">
                    <h2>Easy🍃</h2>
                    <p>
                    A relaxed little challenge to get started.
                    </p>
                    <button id="easybutton" onclick="window.location.href='easy.html'">Play🍃</button>
                </div>
                <div class="level-card">
                    <h2>Medium🙊</h2>
                    <p>
                    The search begins, a little more thinking.
                    </p>
                    <button id="mediumbutton" onclick="window.location.href='medium.html'">let's see what's in it🥊</button>
                </div>
                <div class="level-card">
                    <h2>Hard🤔</h2>
                    <p>
                    Play this when you are bored, You need to pay attention
                    </p>
                    <button id="hardbutton" onclick="window.location.href ='hard.html'">Bring it on🔥</button>
                </div>
            </div>
    </div>
</body>
</html>
