<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday surprise</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <div class="birthday-card">
        <div class="photo-background">
            <img src="birthday.jpeg" alt="Birthday photo">
            <img src="maybe.jpeg" alt="Birthday photo">
            <img src="nope.jpeg" alt="Birthday photo">
        </div>
        <div class="birthday-title">
            <h1>HAPPY</h1>
            <h1>BIRTHDAY</h1>
        </div>
        <div class="special-card">
            <h2>SOMETHING SPECIAL</h2>
            <p>
                Just thought of something special
                to keep you busy for a while.
                Just a game, something to play for your birthday.
            </p>
            <button id="enterbutton">Click Here</button>
        </div>
    </div>
  
<script src="script.js"></script>
</body>
</html>
